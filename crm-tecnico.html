<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Técnico</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Técnico">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🛠️ Órdenes de servicio</h1>
    <div>
      <button id="bInst" hidden>📲 Instalar</button>
      <button id="bCsv" title="Exportar a Excel (CSV)">📥</button>
      <button id="bRes" title="Resumen del mes">📊</button>
      <button id="bCfg" title="Configuración">⚙️</button>
      <button class="pri" id="bNew">+ Nueva orden</button>
    </div>
  </div>
  <div id="modo" class="modo"></div>
  <div id="chips" class="chips"></div>
  <div class="bar">
    <input id="q" placeholder="Buscar por N°, cliente, equipo o teléfono…">
    <select id="fs"></select>
    <select id="fT" style="display:none"></select>
  </div>
  <div id="list"></div>
</div>

<!-- ============ ORDEN ============ -->
<dialog id="dOrd">
  <h3 id="dTitle" style="margin:0 0 4px">Nueva orden</h3>

  <fieldset><legend>Cliente</legend>
    <div class="g2">
      <div><label>Cliente</label><input id="fCli" list="dlCli" autocomplete="off"></div>
      <div><label>WhatsApp (con código de área, sin 15)</label><input id="fTel" type="tel" list="dlTel" autocomplete="off" placeholder="1155551234"></div>
    </div>
    <label>Dirección (opcional)</label><input id="fDir">
    <div id="fCliHist" class="mut"></div>
  </fieldset>

  <fieldset><legend>Equipo</legend>
    <div class="g2">
      <div><label>Equipo</label><input id="fEq" placeholder="Notebook, cortadora..."></div>
      <div><label>Marca</label><input id="fMa"></div>
    </div>
    <div class="g2">
      <div><label>Color</label><input id="fCo"></div>
      <div><label>N° de serie</label><input id="fSe"></div>
    </div>
    <div class="g2">
      <div><label>Accesorios que deja</label><input id="fAc" placeholder="Cargador, bolso..."></div>
      <div><label>Estado físico al ingresar</label><input id="fFi" placeholder="Rayón en tapa..."></div>
    </div>
    <div class="g2">
      <div><label>¿Deteriorado?</label><select id="fDe"><option value=""></option><option>Sí</option><option>No</option></select></div>
      <div><label>Garantía de fábrica</label><input id="fGf" placeholder="Sí / No / vence..."></div>
    </div>
    <label>Contraseña / patrón (interno, no se envía ni se imprime)</label><input id="fCl">
    <label>Falla reportada por el cliente</label><textarea id="fPr"></textarea>
    <label>Checklist de ingreso</label><div id="fChk" class="chk"></div>
    <label>Observaciones</label><textarea id="fOb" style="min-height:50px"></textarea>
  </fieldset>

  <fieldset><legend>Estado y plazos</legend>
    <div class="g2">
      <div><label>Estado</label><select id="fSt"></select></div>
      <div><label>Hora de recepción</label><input id="fHo" type="time"></div>
    </div>
    <label>Técnico asignado</label><select id="fTe"></select>
    <div class="g2">
      <div><label>Fecha estimada de entrega</label><input id="fEe" type="date"></div>
      <div><label>Reparación directa hasta ($)</label><input id="fAu" type="number" min="0"></div>
    </div>
  </fieldset>

  <fieldset><legend>Diagnóstico y dinero</legend>
    <label>Plantilla de diagnóstico</label><select id="fPl"></select>
    <label>Diagnóstico técnico (se envía junto al presupuesto)</label><textarea id="fDx"></textarea>
    <div class="g2">
      <div><label>Presupuesto ($)</label><input id="fMo" type="number" min="0"></div>
      <div><label>Seña ($)</label><input id="fSn" type="number" min="0"></div>
    </div>
    <div class="g2">
      <div><label>Fecha de entrega real (inicia la garantía)</label><input id="fEf" type="date"></div>
      <div><label>&nbsp;</label><label class="inl"><input id="fPg" type="checkbox"> Pagado en su totalidad</label></div>
    </div>
    <label>Repuestos y costos (interno)</label>
    <div id="fRep"></div>
    <div class="acts"><button type="button" id="bRep">+ Repuesto</button><span id="fRepTot" class="mut"></span></div>
  </fieldset>

  <fieldset><legend>Fotos y firma</legend>
    <label>Fotos del equipo</label><input id="fImg" type="file" accept="image/*" multiple>
    <div class="imgs" id="fImgs"></div>
    <label>Firma del cliente (dibujá con el dedo o el mouse)</label>
    <canvas id="fFirma" width="360" height="120"></canvas>
    <div class="acts"><button type="button" id="bFirmaClr">Borrar firma</button></div>
    <label>Firma de retiro (al entregar el equipo)</label>
    <canvas id="fFirma2" width="360" height="120"></canvas>
    <div class="acts"><button type="button" id="bFirma2Clr">Borrar firma</button></div>
  </fieldset>

  <fieldset id="fsHist"><legend>Historial</legend><div id="fHist" class="mut"></div></fieldset>

  <div class="acts" style="justify-content:flex-end;margin-top:14px">
    <button id="bCan">Cancelar</button><button class="pri" id="bSave">Guardar</button>
  </div>
</dialog>

<!-- ============ CONFIGURACIÓN ============ -->
<dialog id="dCfg">
  <h3 style="margin:0">Configuración</h3>
  <fieldset><legend>Taller</legend>
    <label>Nombre del taller</label><input id="cNom">
    <label>Datos del taller (una línea por dato: dirección, horarios, teléfono, web…)</label><textarea id="cDat" style="min-height:70px"></textarea>
    <label>Logo (se agrega al comprobante)</label>
    <div class="acts"><input id="cLogo" type="file" accept="image/*" style="width:auto"><button type="button" id="cLogoDel">Quitar logo</button></div>
    <img id="cLogoPrev" alt="" style="max-height:60px;margin-top:6px;display:none">
    <label class="inl"><input id="cLogoSolo" type="checkbox"> Mostrar solo el logo (sin el nombre escrito)</label>
  </fieldset>
  <fieldset><legend>Numeración, medidas y plazos</legend>
    <div class="g2">
      <div><label>Prefijo de orden</label><input id="cPre"></div>
      <div><label>Código de país (Argentina móvil = 549)</label><input id="cPais"></div>
    </div>
    <div class="g2">
      <div><label>Comprobante: ancho (mm)</label><input id="cAncho" type="number" min="50"></div>
      <div><label>Comprobante: alto (mm)</label><input id="cAlto" type="number" min="50"></div>
    </div>
    <div class="g2">
      <div><label>Etiqueta: ancho (mm)</label><input id="cEtA" type="number" min="20"></div>
      <div><label>Etiqueta: alto (mm)</label><input id="cEtH" type="number" min="20"></div>
    </div>
    <div class="g2">
      <div><label>Días de garantía</label><input id="cGar" type="number" min="0"></div>
      <div><label>Alerta: equipos sin retirar (días)</label><input id="cAle" type="number" min="1"></div>
    </div>
  </fieldset>
  <fieldset><legend>Listas</legend>
    <label>Checklist de ingreso (separado por comas)</label><input id="cChk">
    <label>Plantillas de diagnóstico (una por línea: nombre | texto | precio)</label><textarea id="cPla" style="min-height:90px"></textarea>
  </fieldset>
  <fieldset><legend>Mensajes de WhatsApp</legend>
    <label>General — {cliente} {numero} {equipo} {estado} {taller}</label><textarea id="cMsg" style="min-height:70px"></textarea>
    <label>Presupuesto — además {diagnostico} {presupuesto}</label><textarea id="cMsgP" style="min-height:100px"></textarea>
    <label>Listo para retirar — además {saldo} {garantia}</label><textarea id="cMsgL" style="min-height:70px"></textarea>
    <label>Comprobante de entrega — además {saldo} {garantia}</label><textarea id="cMsgE" style="min-height:70px"></textarea>
    <label>Acompaña al PDF de ingreso</label><textarea id="cMsgPDF" style="min-height:60px"></textarea>
    <label>Comprobante en texto — además {fecha} {serie} {accesorios} {fisico} {falla} {condiciones}</label><textarea id="cMsgC" style="min-height:130px"></textarea>
    <label>Condiciones del taller (van en el comprobante de ingreso)</label><textarea id="cCond" style="min-height:80px"></textarea>
    <label>Condiciones de entrega (van en el comprobante de entrega)</label><textarea id="cCondE" style="min-height:80px"></textarea>
  </fieldset>
  <fieldset><legend>Mi cuenta</legend>
    <div class="mut" id="cQuien"></div>
    <div class="g2">
      <div><label>Contraseña actual</label><input id="cPwA" type="password" autocomplete="current-password"></div>
      <div><label>Contraseña nueva (mínimo 8)</label><input id="cPwN" type="password" autocomplete="new-password"></div>
    </div>
    <div class="acts"><button type="button" id="bPw">Cambiar contraseña</button></div>
  </fieldset>
  <fieldset id="cUsr"><legend>Usuarios (solo administrador)</legend>
    <div id="cUsrList"></div>
    <div class="g2">
      <div><label>Usuario nuevo</label><input id="uNom" autocomplete="off" autocapitalize="none"></div>
      <div><label>Contraseña (mínimo 8)</label><input id="uPw" type="password" autocomplete="new-password"></div>
    </div>
    <div class="g2">
      <div><label>Rol</label><select id="uRol"><option value="tecnico">Técnico</option><option value="admin">Administrador</option></select></div>
      <div><label>&nbsp;</label><button type="button" id="bUAdd">Crear usuario</button></div>
    </div>
  </fieldset>
  <div class="acts" style="justify-content:flex-end;margin-top:14px">
    <button id="cCan">Cancelar</button><button class="pri" id="cSave">Guardar</button>
  </div>
</dialog>

<!-- ============ RESUMEN ============ -->
<dialog id="dRes">
  <h3 style="margin:0">Resumen del mes</h3>
  <label>Mes</label><input id="rMes" type="month">
  <div id="rOut"></div>
  <div class="acts" style="justify-content:flex-end;margin-top:14px"><button id="rCerrar">Cerrar</button></div>
</dialog>

<datalist id="dlCli"></datalist>
<datalist id="dlTel"></datalist>
<div id="comp"></div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
