[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-tecnico"
description = "CRM para técnico informático: órdenes de servicio, comprobantes PDF/QR, WhatsApp y modo sin conexión"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["psycopg[binary]>=3.2,<3.4"]

[tool.setuptools.dynamic]
version = { attr = "crm.__version__" }

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.setuptools.package-data]
crm = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint: solo lo que detecta errores reales (nombres no definidos, imports sin usar...).
# El estilo del proyecto es compacto a propósito, así que no se revisan reglas de formato.
[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"tests/e2e/run.py" = ["F401"]
