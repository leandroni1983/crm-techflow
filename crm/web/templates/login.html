<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · CRM Técnico</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0F6E5A">
<link rel="icon" href="/static/img/favicon.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Técnico">
</head>
<body>
<main class="login">
  <div class="login-box">
    <img src="/static/img/icon-192.png" alt="">
    <h1>CRM Técnico</h1>
    <p class="mut" style="margin:4px 0 0">Ingresá con tu usuario para ver las órdenes del taller.</p>
    <form id="f">
      <label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none" autofocus required>
      <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
      <div id="err" class="err" role="alert"></div>
      <button class="pri" style="width:100%;justify-content:center;margin-top:6px" id="go">Ingresar</button>
    </form>
  </div>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
